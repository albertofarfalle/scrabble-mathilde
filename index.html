<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Mathilde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
        }

        .cell-normal { background-color: #7dd3fc; }
        .cell-ld { background-color: #1e3a8a; color: #fff; }
        .cell-lt { background-color: #f97316; color: #fff; }
        .cell-md { background-color: #facc15; color: #000; }
        .cell-mt { background-color: #dc2626; color: #fff; }
        .cell-center { 
            background: linear-gradient(135deg, #f59e0b, #b45309);
            color: #fff;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.4);
            border: 2px solid #fef08a;
            font-weight: 800;
        }

        .tile {
            background: linear-gradient(145deg, #fef3c7, #fde68a);
            border: 1px solid #d97706;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.8);
            border-radius: 6px;
            color: #451a03;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }

        .tile.selected {
            ring: 3px solid #3b82f6;
            transform: translateY(-4px);
        }

        .tile .points {
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 0.65rem;
            font-weight: 800;
            color: #78350f;
        }

        .tile-placed {
            background: linear-gradient(145deg, #fef08a, #facc15);
            border: 1px solid #b45309;
        }

        .tile-blank {
            color: #92400e;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        .board-grid {
            grid-template-columns: repeat(15, minmax(0, 1fr));
            grid-template-rows: repeat(15, minmax(0, 1fr));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 shadow-md flex justify-between items-center max-w-7xl mx-auto w-full">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider text-amber-400">Scrabble Mathilde</h1>
        <div id="dict-status" class="text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-400 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Chargement dictionnaire...
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left Panel: Scores & Game Infos -->
        <section class="lg:col-span-3 space-y-4">
            <!-- Score Card -->
            <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-lg">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Scores</h2>
                <div class="space-y-3">
                    <div id="player-card" class="flex justify-between items-center p-3 rounded-lg bg-slate-700/50 border border-amber-500/30">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                            <span class="font-bold text-lg text-slate-100">Mathilde</span>
                        </div>
                        <span id="score-player" class="text-2xl font-black text-amber-400">0</span>
                    </div>

                    <div id="bot-card" class="flex justify-between items-center p-3 rounded-lg bg-slate-700/30 border border-transparent">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-slate-500"></span>
                            <span class="font-bold text-lg text-slate-300">ScrabbleBot</span>
                        </div>
                        <span id="score-bot" class="text-2xl font-black text-slate-300">0</span>
                    </div>
                </div>
            </div>

            <!-- Bot Level Selector -->
            <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-lg space-y-2">
                <label for="bot-level" class="text-xs font-semibold text-slate-400 uppercase tracking-widest block">Niveau du Bot</label>
                <select id="bot-level" onchange="changeBotLevel()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-amber-400 font-bold focus:outline-none focus:border-amber-500">
                    <option value="easy">Facile (coups simples)</option>
                    <option value="medium" selected>Intermédiaire (médiane)</option>
                    <option value="expert">Expert (meilleurs coups)</option>
                </select>
            </div>

            <!-- Game Info -->
            <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-lg space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Sac de jetons :</span>
                    <span id="bag-count" class="font-bold text-amber-300">102</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Tour actuel :</span>
                    <span id="turn-display" class="font-bold text-emerald-400">Mathilde</span>
                </div>
            </div>

            <!-- Action Logs -->
            <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-lg flex flex-col h-52">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Historique</h2>
                <div id="log-list" class="flex-1 overflow-y-auto space-y-1.5 text-xs text-slate-300 pr-1">
                    <div class="text-slate-400 italic">La partie commence. Bon jeu Mathilde !</div>
                </div>
            </div>
        </section>

        <!-- Center Panel: Scrabble Board -->
        <section class="lg:col-span-6 flex flex-col items-center">
            <div class="w-full max-w-[560px] aspect-square bg-slate-950 p-2 rounded-xl shadow-2xl border border-slate-800">
                <div id="board" class="w-full h-full grid board-grid gap-0.5 rounded overflow-hidden">
                    <!-- Board cells JS inserted -->
                </div>
            </div>

            <!-- Player Rack & Controls -->
            <div class="w-full max-w-[560px] mt-4 space-y-3">
                <!-- Rack -->
                <div class="bg-amber-950/40 p-3 rounded-xl border border-amber-900/50 shadow-inner flex justify-center items-center gap-2 min-h-[68px]" id="player-rack">
                    <!-- Player tiles JS inserted -->
                </div>

                <!-- Game Controls -->
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                    <button id="btn-play" onclick="playTurn()" class="px-3 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-semibold text-xs sm:text-sm shadow transition active:scale-95 flex items-center justify-center">
                        Valider
                    </button>
                    <button id="btn-recall" onclick="recallTiles()" class="px-3 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-100 rounded-lg font-semibold text-xs sm:text-sm shadow transition active:scale-95 flex items-center justify-center">
                        Rappeler
                    </button>
                    <button id="btn-swap" onclick="swapTiles()" class="px-3 py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-semibold text-xs sm:text-sm shadow transition active:scale-95 flex items-center justify-center">
                        Changer
                    </button>
                    <button id="btn-pass" onclick="passTurn()" class="px-3 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-100 rounded-lg font-semibold text-xs sm:text-sm shadow transition active:scale-95 flex items-center justify-center">
                        Passer
                    </button>
                    <button id="btn-help" onclick="getHint()" class="col-span-2 sm:col-span-1 px-3 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold text-xs sm:text-sm shadow transition active:scale-95 flex items-center justify-center">
                        Aide
                    </button>
                </div>
            </div>
        </section>

        <!-- Right Panel: Dictionnaire / Info Help -->
        <section class="lg:col-span-3 space-y-4">
            <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-lg space-y-3">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Contrôle Dictionnaire</h2>
                <div class="flex gap-2">
                    <input type="text" id="dict-search" placeholder="Vérifier un mot..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500 uppercase">
                    <button onclick="checkWordManual()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-lg font-medium">Test</button>
                </div>
                <div id="dict-result" class="text-xs font-medium text-slate-400 min-h-[1.25rem]"></div>
            </div>

            <!-- Hint Display Box -->
            <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 shadow-lg">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Conseil de ScrabbleBot</h2>
                <div id="hint-output" class="text-xs text-slate-300 leading-relaxed italic">
                    Cliquez sur "Aide" pour obtenir un indice sur les coups réalisables.
                </div>
            </div>

            <!-- Restart Game -->
            <div class="pt-2">
                <button onclick="confirmRestart()" class="w-full py-2.5 bg-rose-700/80 hover:bg-rose-600 text-white font-medium text-xs rounded-lg transition border border-rose-600/50">
                    Recommencer une partie
                </button>
            </div>
        </section>
    </main>

    <!-- Modal for Messages / Blank Selection -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <h3 id="modal-title" class="text-lg font-bold text-amber-400"></h3>
            <p id="modal-body" class="text-sm text-slate-300"></p>
            <div id="modal-content" class="flex flex-wrap gap-2 justify-center"></div>
            <button id="modal-close" onclick="closeModal()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold">Fermer</button>
        </div>
    </div>

    <!-- Embedded Scripts -->
    <script>
        const LETTER_DISTRIBUTION = [
            { letter: 'A', points: 1, count: 9 }, { letter: 'B', points: 3, count: 2 },
            { letter: 'C', points: 3, count: 2 }, { letter: 'D', points: 2, count: 3 },
            { letter: 'E', points: 1, count: 15 }, { letter: 'F', points: 4, count: 2 },
            { letter: 'G', points: 2, count: 2 }, { letter: 'H', points: 4, count: 2 },
            { letter: 'I', points: 1, count: 8 }, { letter: 'J', points: 8, count: 1 },
            { letter: 'K', points: 10, count: 1 }, { letter: 'L', points: 1, count: 5 },
            { letter: 'M', points: 2, count: 3 }, { letter: 'N', points: 1, count: 6 },
            { letter: 'O', points: 1, count: 6 }, { letter: 'P', points: 3, count: 2 },
            { letter: 'Q', points: 8, count: 1 }, { letter: 'R', points: 1, count: 6 },
            { letter: 'S', points: 1, count: 6 }, { letter: 'T', points: 1, count: 6 },
            { letter: 'U', points: 1, count: 6 }, { letter: 'V', points: 4, count: 2 },
            { letter: 'W', points: 10, count: 1 }, { letter: 'X', points: 10, count: 1 },
            { letter: 'Y', points: 10, count: 1 }, { letter: 'Z', points: 10, count: 1 },
            { letter: '?', points: 0, count: 2 }
        ];

        const BOARD_BONUSES = [
            ['MT','..','..','LD','..','..','..','MT','..','..','..','LD','..','..','MT'],
            ['..','MD','..','..','..','LT','..','..','..','LT','..','..','..','MD','..'],
            ['..','..','MD','..','..','..','LD','..','LD','..','..','..','MD','..','..'],
            ['LD','..','..','MD','..','..','..','LD','..','..','..','MD','..','..','LD'],
            ['..','..','..','..','MD','..','..','..','..','..','MD','..','..','..','..'],
            ['..','LT','..','..','..','LT','..','..','..','LT','..','..','..','LT','..'],
            ['..','..','LD','..','..','..','LD','..','LD','..','..','..','LD','..','..'],
            ['MT','..','..','LD','..','..','..','CC','..','..','..','LD','..','..','MT'],
            ['..','..','LD','..','..','..','LD','..','LD','..','..','..','LD','..','..'],
            ['..','LT','..','..','..','LT','..','..','..','LT','..','..','..','LT','..'],
            ['..','..','..','..','MD','..','..','..','..','..','MD','..','..','..','..'],
            ['LD','..','..','MD','..','..','..','LD','..','..','..','MD','..','..','LD'],
            ['..','..','MD','..','..','..','LD','..','LD','..','..','..','MD','..','..'],
            ['..','MD','..','..','..','LT','..','..','..','LT','..','..','..','MD','..'],
            ['MT','..','..','LD','..','..','..','MT','..','..','..','LD','..','..','MT']
        ];

        let FRENCH_WORDS = new Set();
        let WORDS_BY_LENGTH = {}; // Dictionnaire structuré par longueur de mot

        async function loadOnlineDictionary() {
            const statusEl = document.getElementById('dict-status');
            const sources = [
                'https://cdn.jsdelivr.net/gh/Thecoolsim/French-Scrabble-ODS8@main/French%20ODS%20dictionary.txt',
                'https://raw.githubusercontent.com/Thecoolsim/French-Scrabble-ODS8/main/French%20ODS%20dictionary.txt'
            ];

            for (let url of sources) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;

                    const text = await response.text();
                    const wordsArray = text.split(/\r?\n/).map(w => w.trim().toUpperCase()).filter(w => w.length >= 2 && w.length <= 15);
                    
                    if (wordsArray.length > 100000) {
                        FRENCH_WORDS = new Set(wordsArray);
                        WORDS_BY_LENGTH = {};
                        for (let w of wordsArray) {
                            let len = w.length;
                            if (!WORDS_BY_LENGTH[len]) WORDS_BY_LENGTH[len] = [];
                            WORDS_BY_LENGTH[len].push(w);
                        }

                        if (statusEl) {
                            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ODS8 Chargé (${FRENCH_WORDS.size.toLocaleString()} mots)`;
                            statusEl.className = "text-xs px-3 py-1 rounded-full bg-slate-800 border border-emerald-500/30 text-emerald-400 flex items-center gap-2";
                        }
                        return;
                    }
                } catch (e) {
                    console.warn("Échec source:", url, e);
                }
            }

            if (statusEl) {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Problème réseau dictionnaire`;
                statusEl.className = "text-xs px-3 py-1 rounded-full bg-slate-800 border border-amber-500/30 text-amber-300 flex items-center gap-2";
            }
        }

        let boardState = Array(15).fill(null).map(() => Array(15).fill(null));
        let bag = [];
        let playerRack = [];
        let botRack = [];
        let playerScore = 0;
        let botScore = 0;
        let isPlayerTurn = true;
        let firstMoveMade = false;
        let botLevel = 'medium';

        let selectedRackTileIndex = null;
        let tempPlacedTiles = [];

        function changeBotLevel() {
            botLevel = document.getElementById('bot-level').value;
        }

        function createBoardUI() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    const bonus = BOARD_BONUSES[r][c];
                    let bonusClass = 'cell-normal';
                    let label = '';

                    if (bonus === 'MT') { bonusClass = 'cell-mt'; label = 'MT'; }
                    else if (bonus === 'MD') { bonusClass = 'cell-md'; label = 'MD'; }
                    else if (bonus === 'LT') { bonusClass = 'cell-lt'; label = 'LT'; }
                    else if (bonus === 'LD') { bonusClass = 'cell-ld'; label = 'LD'; }
                    else if (bonus === 'CC') { bonusClass = 'cell-center'; label = 'M'; }

                    cell.className = `relative flex items-center justify-center text-[10px] sm:text-xs font-bold rounded-xs cursor-pointer select-none transition ${bonusClass}`;
                    cell.innerText = label;

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function initBag() {
            bag = [];
            LETTER_DISTRIBUTION.forEach(item => {
                for (let i = 0; i < item.count; i++) {
                    bag.push({ letter: item.letter, points: item.points });
                }
            });
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
            updateBagCount();
        }

        function drawTiles(count) {
            const drawn = [];
            for (let i = 0; i < count; i++) {
                if (bag.length === 0) break;
                drawn.push(bag.pop());
            }
            updateBagCount();
            return drawn;
        }

        function updateBagCount() {
            document.getElementById('bag-count').innerText = bag.length;
        }

        function renderPlayerRack() {
            const rackEl = document.getElementById('player-rack');
            rackEl.innerHTML = '';

            playerRack.forEach((tile, index) => {
                const isPlaced = tempPlacedTiles.some(pt => pt.originalRackIndex === index);

                const tileEl = document.createElement('div');
                tileEl.className = `tile w-10 h-10 text-base sm:w-12 sm:h-12 sm:text-lg ${isPlaced ? 'opacity-30 pointer-events-none' : ''} ${selectedRackTileIndex === index ? 'selected' : ''}`;
                
                if (tile.letter === '?') {
                    tileEl.innerHTML = `<span class="tile-blank">?</span><span class="points">0</span>`;
                } else {
                    tileEl.innerHTML = `<span>${tile.letter}</span><span class="points">${tile.points}</span>`;
                }

                tileEl.addEventListener('click', () => {
                    if (isPlaced) return;
                    if (selectedRackTileIndex === index) {
                        selectedRackTileIndex = null;
                    } else {
                        selectedRackTileIndex = index;
                    }
                    renderPlayerRack();
                });

                rackEl.appendChild(tileEl);
            });
        }

        function handleCellClick(r, c) {
            if (!isPlayerTurn) return;

            const tempIndex = tempPlacedTiles.findIndex(pt => pt.r === r && pt.c === c);
            if (tempIndex !== -1) {
                tempPlacedTiles.splice(tempIndex, 1);
                renderBoardState();
                renderPlayerRack();
                return;
            }

            if (selectedRackTileIndex !== null && boardState[r][c] === null) {
                const tile = playerRack[selectedRackTileIndex];

                if (tile.letter === '?') {
                    openBlankSelector((chosenLetter) => {
                        const tileToPlace = { letter: chosenLetter, points: 0, isBlank: true };
                        tempPlacedTiles.push({ r, c, tile: tileToPlace, originalRackIndex: selectedRackTileIndex });
                        selectedRackTileIndex = null;
                        renderBoardState();
                        renderPlayerRack();
                    });
                } else {
                    tempPlacedTiles.push({ r, c, tile, originalRackIndex: selectedRackTileIndex });
                    selectedRackTileIndex = null;
                    renderBoardState();
                    renderPlayerRack();
                }
            }
        }

        function renderBoardState() {
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                    const placedState = boardState[r][c];
                    const tempState = tempPlacedTiles.find(pt => pt.r === r && pt.c === c);

                    if (placedState) {
                        cell.className = "relative flex items-center justify-center font-bold text-sm sm:text-base rounded tile tile-placed";
                        cell.innerHTML = `<span>${placedState.letter}</span><span class="points">${placedState.points}</span>`;
                    } else if (tempState) {
                        cell.className = "relative flex items-center justify-center font-bold text-sm sm:text-base rounded tile border-2 border-blue-500 animate-pulse";
                        cell.innerHTML = `<span>${tempState.tile.letter}</span><span class="points">${tempState.tile.points}</span>`;
                    } else {
                        const bonus = BOARD_BONUSES[r][c];
                        let bonusClass = 'cell-normal';
                        let label = '';
                        if (bonus === 'MT') { bonusClass = 'cell-mt'; label = 'MT'; }
                        else if (bonus === 'MD') { bonusClass = 'cell-md'; label = 'MD'; }
                        else if (bonus === 'LT') { bonusClass = 'cell-lt'; label = 'LT'; }
                        else if (bonus === 'LD') { bonusClass = 'cell-ld'; label = 'LD'; }
                        else if (bonus === 'CC') { bonusClass = 'cell-center'; label = 'M'; }

                        cell.className = `relative flex items-center justify-center text-[10px] sm:text-xs font-bold rounded-xs cursor-pointer select-none transition ${bonusClass}`;
                        cell.innerText = label;
                    }
                }
            }
        }

        function recallTiles() {
            tempPlacedTiles = [];
            selectedRackTileIndex = null;
            renderBoardState();
            renderPlayerRack();
        }

        function playTurn() {
            if (!isPlayerTurn) return;

            if (tempPlacedTiles.length === 0) {
                showModal("Aucun jeton posé", "Veuillez placer au moins un jeton sur le plateau.");
                return;
            }

            const moveValidation = validatePlacement(tempPlacedTiles);
            if (!moveValidation.valid) {
                showModal("Coup Invalide", moveValidation.reason);
                return;
            }

            const scoreResult = calculateMoveScore(tempPlacedTiles);
            if (!scoreResult.valid) {
                showModal("Mot non reconnu", `Un des mots formés (${scoreResult.invalidWord}) n'est pas reconnu dans l'ODS.`);
                return;
            }

            tempPlacedTiles.forEach(pt => {
                boardState[pt.r][pt.c] = pt.tile;
            });

            const indicesToRemove = tempPlacedTiles.map(pt => pt.originalRackIndex).sort((a,b) => b - a);
            indicesToRemove.forEach(idx => playerRack.splice(idx, 1));

            const drawn = drawTiles(tempPlacedTiles.length);
            playerRack.push(...drawn);

            playerScore += scoreResult.score;
            document.getElementById('score-player').innerText = playerScore;

            logAction(`Mathilde a joué <b>${scoreResult.words.join(', ')}</b> pour <b>+${scoreResult.score} pts</b>.`);

            tempPlacedTiles = [];
            selectedRackTileIndex = null;
            firstMoveMade = true;

            renderBoardState();
            renderPlayerRack();

            switchTurn(false);
        }

        function passTurn() {
            if (!isPlayerTurn) return;
            recallTiles();
            logAction("Mathilde passe son tour.");
            switchTurn(false);
        }

        function swapTiles() {
            if (!isPlayerTurn) return;
            if (bag.length < 7) {
                showModal("Échange impossible", "Il doit y avoir au moins 7 jetons dans le sac pour échanger.");
                return;
            }

            recallTiles();
            
            bag.push(...playerRack);
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
            playerRack = [];
            playerRack = drawTiles(7);

            logAction("Mathilde a changé ses lettres.");
            renderPlayerRack();

            if (!firstMoveMade) {
                logAction("C'est toujours à Mathilde de commencer.");
                return;
            }

            switchTurn(false);
        }

        function switchTurn(toPlayer) {
            isPlayerTurn = toPlayer;
            const turnEl = document.getElementById('turn-display');
            const playerCard = document.getElementById('player-card');
            const botCard = document.getElementById('bot-card');

            if (isPlayerTurn) {
                turnEl.innerText = "Mathilde";
                turnEl.className = "font-bold text-emerald-400";
                playerCard.classList.add('border-amber-500/30');
                botCard.classList.remove('border-amber-500/30');
            } else {
                turnEl.innerText = "ScrabbleBot...";
                turnEl.className = "font-bold text-indigo-400";
                botCard.classList.add('border-amber-500/30');
                playerCard.classList.remove('border-amber-500/30');

                setTimeout(botPlayTurn, 600);
            }
        }

        function botPlayTurn() {
            let selectedMove = selectBotMoveByDifficulty(botRack);

            if (selectedMove) {
                selectedMove.tilesPlaced.forEach(pt => {
                    boardState[pt.r][pt.c] = pt.tile;
                    const idx = botRack.findIndex(t => t.letter === (pt.tile.isBlank ? '?' : pt.tile.letter));
                    if (idx !== -1) botRack.splice(idx, 1);
                });

                botScore += selectedMove.score;
                document.getElementById('score-bot').innerText = botScore;
                logAction(`ScrabbleBot a joué <b>${selectedMove.word}</b> pour <b>+${selectedMove.score} pts</b>.`);

                botRack.push(...drawTiles(7 - botRack.length));
                firstMoveMade = true;
            } else {
                if (bag.length >= 7) {
                    bag.push(...botRack);
                    for (let i = bag.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [bag[i], bag[j]] = [bag[j], bag[i]];
                    }
                    botRack = drawTiles(7);
                    logAction("ScrabbleBot a changé ses lettres.");
                } else {
                    logAction("ScrabbleBot passe son tour.");
                }
            }

            renderBoardState();
            switchTurn(true);
        }

        function selectBotMoveByDifficulty(rack) {
            let moves = findAllPossibleMoves(rack);

            if (moves.length === 0) return null;

            moves.sort((a, b) => a.score - b.score);

            if (botLevel === 'easy') {
                return moves[0];
            } else if (botLevel === 'medium') {
                let midIndex = Math.floor(moves.length / 2);
                return moves[midIndex];
            } else {
                return moves[moves.length - 1];
            }
        }

        function findAllPossibleMoves(rack) {
            let validMoves = [];

            if (!firstMoveMade) {
                for (let len = 2; len <= 7; len++) {
                    const wordList = WORDS_BY_LENGTH[len] || [];
                    for (let word of wordList) {
                        if (canFormWord(word, rack)) {
                            let tilesToPlace = [];
                            let tempRack = [...rack];

                            for (let i = 0; i < word.length; i++) {
                                let char = word[i];
                                let matchIdx = tempRack.findIndex(t => t.letter === char);
                                let tileObj;
                                if (matchIdx !== -1) {
                                    tileObj = tempRack[matchIdx];
                                    tempRack.splice(matchIdx, 1);
                                } else {
                                    matchIdx = tempRack.findIndex(t => t.letter === '?');
                                    if (matchIdx !== -1) {
                                        tileObj = { letter: char, points: 0, isBlank: true };
                                        tempRack.splice(matchIdx, 1);
                                    }
                                }
                                tilesToPlace.push({ r: 7, c: 7 + i, tile: tileObj });
                            }

                            const scoreRes = calculateMoveScore(tilesToPlace);
                            if (scoreRes.valid) {
                                validMoves.push({ word, score: scoreRes.score, tilesPlaced: tilesToPlace });
                            }
                        }
                    }
                }
            } else {
                let anchorCells = [];
                for (let r = 0; r < 15; r++) {
                    for (let c = 0; c < 15; c++) {
                        if (boardState[r][c] === null && hasAdjacentTile(r, c)) {
                            anchorCells.push({ r, c });
                        }
                    }
                }

                for (let anchor of anchorCells) {
                    for (let len = 2; len <= 8; len++) {
                        const wordList = WORDS_BY_LENGTH[len] || [];
                        for (let word of wordList) {
                            for (let offset = 0; offset < word.length; offset++) {
                                let startH = { r: anchor.r, c: anchor.c - offset };
                                let moveH = tryPlaceWordAt(word, startH.r, startH.c, 'H', rack);
                                if (moveH) validMoves.push(moveH);

                                let startV = { r: anchor.r - offset, c: anchor.c };
                                let moveV = tryPlaceWordAt(word, startV.r, startV.c, 'V', rack);
                                if (moveV) validMoves.push(moveV);
                            }
                        }
                    }
                    if (validMoves.length > 150) break;
                }
            }

            return validMoves;
        }

        function hasAdjacentTile(r, c) {
            const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
            for (let [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15) {
                    if (boardState[nr][nc] !== null) return true;
                }
            }
            return false;
        }

        function tryPlaceWordAt(word, r, c, dir, currentRack) {
            if (r < 0 || c < 0) return null;

            let tilesToPlace = [];
            let tempRack = [...currentRack];

            for (let i = 0; i < word.length; i++) {
                let currR = dir === 'H' ? r : r + i;
                let currC = dir === 'H' ? c + i : c;

                if (currR >= 15 || currC >= 15) return null;

                if (boardState[currR][currC] !== null) {
                    if (boardState[currR][currC].letter !== word[i]) {
                        return null;
                    }
                } else {
                    let char = word[i];
                    let matchIdx = tempRack.findIndex(t => t.letter === char);
                    let tileObj;

                    if (matchIdx !== -1) {
                        tileObj = tempRack[matchIdx];
                        tempRack.splice(matchIdx, 1);
                    } else {
                        let blankIdx = tempRack.findIndex(t => t.letter === '?');
                        if (blankIdx !== -1) {
                            tileObj = { letter: char, points: 0, isBlank: true };
                            tempRack.splice(blankIdx, 1);
                        } else {
                            return null;
                        }
                    }
                    tilesToPlace.push({ r: currR, c: currC, tile: tileObj });
                }
            }

            if (tilesToPlace.length === 0) return null;

            const val = validatePlacement(tilesToPlace);
            if (!val.valid) return null;

            const scoreRes = calculateMoveScore(tilesToPlace);
            if (!scoreRes.valid) return null;

            return { word, score: scoreRes.score, tilesPlaced: tilesToPlace };
        }

        function canFormWord(word, rack) {
            let tempRack = rack.map(t => t.letter);
            for (let char of word) {
                let idx = tempRack.indexOf(char);
                if (idx !== -1) {
                    tempRack.splice(idx, 1);
                } else {
                    let blankIdx = tempRack.indexOf('?');
                    if (blankIdx !== -1) {
                        tempRack.splice(blankIdx, 1);
                    } else {
                        return false;
                    }
                }
            }
            return true;
        }

        function validatePlacement(placed) {
            if (placed.length === 0) return { valid: false, reason: "Aucun jeton posé." };

            const sameRow = placed.every(pt => pt.r === placed[0].r);
            const sameCol = placed.every(pt => pt.c === placed[0].c);

            if (!sameRow && !sameCol) {
                return { valid: false, reason: "Les jetons posés doivent être alignés horizontalement ou verticalement." };
            }

            if (!firstMoveMade) {
                const coversCenter = placed.some(pt => pt.r === 7 && pt.c === 7);
                if (!coversCenter) {
                    return { valid: false, reason: "Le premier mot doit recouvrir la case centrale (M)." };
                }
            }

            if (sameRow) {
                const r = placed[0].r;
                const cols = placed.map(pt => pt.c).sort((a,b) => a - b);
                for (let c = cols[0]; c <= cols[cols.length - 1]; c++) {
                    if (boardState[r][c] === null && !placed.some(pt => pt.c === c)) {
                        return { valid: false, reason: "Les lettres doivent former un mot continu." };
                    }
                }
            } else {
                const c = placed[0].c;
                const rows = placed.map(pt => pt.r).sort((a,b) => a - b);
                for (let r = rows[0]; r <= rows[rows.length - 1]; r++) {
                    if (boardState[r][c] === null && !placed.some(pt => pt.r === r)) {
                        return { valid: false, reason: "Les lettres doivent former un mot continu." };
                    }
                }
            }

            if (firstMoveMade) {
                let connects = false;
                for (let pt of placed) {
                    if (hasAdjacentTile(pt.r, pt.c)) {
                        connects = true;
                        break;
                    }
                }
                if (!connects) {
                    return { valid: false, reason: "Le mot posé doit toucher au moins une lettre sur le plateau." };
                }
            }

            return { valid: true };
        }

        function calculateMoveScore(placed) {
            let tempBoard = boardState.map(row => [...row]);
            placed.forEach(pt => {
                tempBoard[pt.r][pt.c] = pt.tile;
            });

            let totalScore = 0;
            let wordsFormed = [];

            const sameRow = placed.every(pt => pt.r === placed[0].r);
            
            let mainWordInfo = getFullWordAt(tempBoard, placed[0].r, placed[0].c, sameRow ? 'H' : 'V');

            if (mainWordInfo.word.length > 1) {
                if (FRENCH_WORDS.size > 0 && !FRENCH_WORDS.has(mainWordInfo.word)) {
                    return { valid: false, invalidWord: mainWordInfo.word };
                }
                wordsFormed.push(mainWordInfo.word);
                totalScore += computeWordPoints(mainWordInfo, placed);
            }

            for (let pt of placed) {
                let crossDir = sameRow ? 'V' : 'H';
                let crossWordInfo = getFullWordAt(tempBoard, pt.r, pt.c, crossDir);

                if (crossWordInfo.word.length > 1) {
                    if (FRENCH_WORDS.size > 0 && !FRENCH_WORDS.has(crossWordInfo.word)) {
                        return { valid: false, invalidWord: crossWordInfo.word };
                    }
                    wordsFormed.push(crossWordInfo.word);
                    totalScore += computeWordPoints(crossWordInfo, placed);
                }
            }

            if (placed.length === 7) {
                totalScore += 50;
            }

            return { valid: true, score: totalScore, words: wordsFormed };
        }

        function getFullWordAt(board, r, c, dir) {
            let cells = [];
            if (dir === 'H') {
                let startC = c;
                while (startC > 0 && board[r][startC - 1] !== null) startC--;
                let currC = startC;
                while (currC < 15 && board[r][currC] !== null) {
                    cells.push({ r, c: currC, tile: board[r][currC] });
                    currC++;
                }
            } else {
                let startR = r;
                while (startR > 0 && board[startR - 1][c] !== null) startR--;
                let currR = startR;
                while (currR < 15 && board[currR][c] !== null) {
                    cells.push({ r: currR, c, tile: board[currR][c] });
                    currR++;
                }
            }

            let word = cells.map(cell => cell.tile.letter).join('');
            return { word, cells };
        }

        function computeWordPoints(wordInfo, newlyPlaced) {
            let wordMultiplier = 1;
            let currentPoints = 0;

            wordInfo.cells.forEach(cell => {
                let isNew = newlyPlaced.some(pt => pt.r === cell.r && pt.c === cell.c);
                let letterPts = cell.tile.points;

                if (isNew) {
                    const bonus = BOARD_BONUSES[cell.r][cell.c];
                    if (bonus === 'LD') letterPts *= 2;
                    else if (bonus === 'LT') letterPts *= 3;
                    else if (bonus === 'MD' || bonus === 'CC') wordMultiplier *= 2;
                    else if (bonus === 'MT') wordMultiplier *= 3;
                }

                currentPoints += letterPts;
            });

            return currentPoints * wordMultiplier;
        }

        function getHint() {
            if (!isPlayerTurn) return;

            const hintBox = document.getElementById('hint-output');
            hintBox.innerText = "Recherche d'un coup possible...";

            setTimeout(() => {
                let allMoves = findAllPossibleMoves(playerRack);
                if (allMoves.length > 0) {
                    allMoves.sort((a, b) => b.score - a.score);
                    let bestHint = allMoves[0];
                    hintBox.innerHTML = `Suggestion : <b class="text-amber-400 font-bold">${bestHint.word}</b> pour environ <b class="text-emerald-400 font-bold">+${bestHint.score} pts</b>.`;
                } else {
                    hintBox.innerText = "Aucun mot évident trouvé. Pensez à échanger ou passer.";
                }
            }, 300);
        }

        function checkWordManual() {
            const input = document.getElementById('dict-search');
            const res = document.getElementById('dict-result');
            const word = input.value.trim().toUpperCase();

            if (!word) return;

            if (FRENCH_WORDS.has(word)) {
                res.innerText = `✓ "${word}" est valide dans l'ODS.`;
                res.className = "text-xs font-medium text-emerald-400";
            } else {
                res.innerText = `✕ "${word}" n'est pas reconnu.`;
                res.className = "text-xs font-medium text-rose-400";
            }
        }

        function openBlankSelector(callback) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            const content = document.getElementById('modal-content');
            const closeBtn = document.getElementById('modal-close');

            title.innerText = "Joker !";
            body.innerText = "Choisissez la lettre du Joker :";
            content.innerHTML = '';
            closeBtn.classList.add('hidden');

            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let char of alphabet) {
                const btn = document.createElement('button');
                btn.className = "w-8 h-8 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded shadow text-sm";
                btn.innerText = char;
                btn.onclick = () => {
                    closeModal();
                    closeBtn.classList.remove('hidden');
                    callback(char);
                };
                content.appendChild(btn);
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function showModal(titleText, bodyText) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').innerText = titleText;
            document.getElementById('modal-body').innerText = bodyText;
            document.getElementById('modal-content').innerHTML = '';
            document.getElementById('modal-close').classList.remove('hidden');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function logAction(msg) {
            const logList = document.getElementById('log-list');
            const entry = document.createElement('div');
            entry.className = "border-b border-slate-700/50 pb-1";
            entry.innerHTML = msg;
            logList.prepend(entry);
        }

        function confirmRestart() {
            if (confirm("Recommencer une nouvelle partie ?")) {
                startNewGame();
            }
        }

        function startNewGame() {
            boardState = Array(15).fill(null).map(() => Array(15).fill(null));
            playerScore = 0;
            botScore = 0;
            isPlayerTurn = true;
            firstMoveMade = false;
            tempPlacedTiles = [];
            selectedRackTileIndex = null;

            document.getElementById('score-player').innerText = "0";
            document.getElementById('score-bot').innerText = "0";
            document.getElementById('log-list').innerHTML = `<div class="text-slate-400 italic">Nouvelle partie initiée. Bon jeu Mathilde !</div>`;

            initBag();
            playerRack = drawTiles(7);
            botRack = drawTiles(7);

            createBoardUI();
            renderPlayerRack();
            switchTurn(true);
        }

        window.onload = async function() {
            startNewGame();
            await loadOnlineDictionary();
        };
    </script>
